services:
  api:
    container_name: identity-api
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - .env
      - .env.compose
    ports:
      - "8080:8080"
    networks:
      - data
      - messaging
      - observability
    restart: unless-stopped

  worker:
    container_name: identity-consumer
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-local}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    env_file:
      - .env
      - .env.compose
    entrypoint: ["/app/consumer"]
    networks:
      - data
      - messaging
      - observability
    restart: unless-stopped

networks:
  data:
    external: true
    name: data

  messaging:
    external: true
    name: messaging

  observability:
    external: true
    name: observability